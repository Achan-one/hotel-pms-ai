spring:
  datasource:
    # 프로젝트 루트 경로에 pmsdb.mv.db 파일 형태로 저장되어 서버 재시작 시에도 유지됩니다.
    url: jdbc:h2:file:./pmsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always # 서버 기동 시 resources/data.sql을 읽어 초기 도면을 적재