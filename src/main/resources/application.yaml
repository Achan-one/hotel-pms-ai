spring:
  datasource:
    # 포트, DB명, 비밀번호를 환경 변수(${MYSQL_...})로부터 주입받고, 없을 경우 기본값(:3307 등)을 사용하도록 구성
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:hotel_pms}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      # Flyway가 DDL을 담당하므로 JPA 스키마 자동 생성을 끄고 엔티티 정합성만 검증
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false

  sql:
    init:
      # data.sql / schema.sql 중복 실행 방지
      mode: never

  # 🚀 Flyway 활성화 (DB 형상 및 191실 시드 자동 관리)
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration