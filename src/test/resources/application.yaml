spring:
  datasource:
    # ⚠️ MODE=PostgreSQL -> MODE=MySQL 로 변경
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  # 🚀 테스트 시 Flyway 자동 실행 방지 (H2는 data.sql로 가볍게 구동)
  flyway:
    enabled: false

jwt:
  secret: test-only-secret-key-for-junit-0123456789abcdef