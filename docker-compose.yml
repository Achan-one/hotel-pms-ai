services:
  hotel-mysql:
    image: mysql:8.4
    container_name: hotel-pms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_pms}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - hotel_pms_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  hotel_pms_data:
    name: hotel_pms_isolated_volume