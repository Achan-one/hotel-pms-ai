name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 전체 테스트. ubuntu 러너에는 Docker가 있어서 실제 MySQL 8.4 컨테이너(Testcontainers)로 도는
      # 통합 테스트(Flyway 마이그레이션, 락 동작)까지 함께 실행된다.
      # AI 정확도 평가(aiEval)는 유료 API를 호출하므로 여기서 돌리지 않는다. ai-eval.yml 참고.
      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14
